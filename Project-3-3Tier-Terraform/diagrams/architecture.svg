<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <!-- VPC -->
  <rect x="30" y="30" width="840" height="440" fill="none" stroke="#232F3E" stroke-width="2" rx="8"/>
  <text x="45" y="55" font-size="16" font-weight="bold" fill="#232F3E">VPC (10.0.0.0/16)</text>

  <!-- Public Subnet -->
  <rect x="60" y="80" width="360" height="180" fill="#E8F4FA" stroke="#147EBA" stroke-width="1.5" rx="6"/>
  <text x="75" y="102" font-size="13" font-weight="bold" fill="#147EBA">Public Subnet (10.0.1.0/24)</text>
  <rect x="90" y="130" width="140" height="90" fill="#FF9900" rx="6"/>
  <text x="120" y="170" font-size="12" fill="#fff" font-weight="bold">Web Tier EC2</text>
  <text x="105" y="188" font-size="11" fill="#fff">Nginx + Form</text>
  <rect x="260" y="130" width="130" height="60" fill="#527FFF" rx="6"/>
  <text x="275" y="165" font-size="12" fill="#fff" font-weight="bold">NAT Gateway</text>

  <!-- Private Subnet -->
  <rect x="460" y="80" width="380" height="360" fill="#FDF2E9" stroke="#D86613" stroke-width="1.5" rx="6"/>
  <text x="475" y="102" font-size="13" font-weight="bold" fill="#D86613">Private Subnet (10.0.11.0/24)</text>

  <rect x="500" y="130" width="150" height="90" fill="#FF9900" rx="6"/>
  <text x="530" y="170" font-size="12" fill="#fff" font-weight="bold">App Tier EC2</text>
  <text x="515" y="188" font-size="11" fill="#fff">PHP submit.php</text>

  <rect x="500" y="260" width="150" height="90" fill="#3B48CC" rx="6"/>
  <text x="540" y="300" font-size="12" fill="#fff" font-weight="bold">RDS</text>
  <text x="515" y="318" font-size="11" fill="#fff">MySQL / Postgres</text>

  <!-- Internet Gateway -->
  <rect x="380" y="10" width="140" height="40" fill="#8C4FFF" rx="6"/>
  <text x="395" y="35" font-size="12" fill="#fff" font-weight="bold">Internet Gateway</text>

  <!-- Arrows -->
  <line x1="160" y1="130" x2="450" y2="30" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="160" x2="500" y2="175" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="220" x2="575" y2="260" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
  </defs>

  <text x="45" y="470" font-size="11" fill="#555">User → Internet Gateway → Web Tier (public) → App Tier (private) → RDS (private)</text>
</svg>
