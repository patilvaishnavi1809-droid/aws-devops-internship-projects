---
- name: Configure Web Tier (Nginx + Registration Form)
  hosts: web
  become: true
  tasks:
    - name: Install Nginx
      yum:
        name: nginx
        state: present

    - name: Deploy registration form
      template:
        src: templates/registration.html.j2
        dest: /usr/share/nginx/html/index.html

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: true
