<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🎓 Student Registration</h1>
    <a class="nav-link" href="{{ url_for('students') }}">View Registered Students →</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}" onsubmit="return validateForm()">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required minlength="2">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" value="{{ form.get('phone', '') }}" pattern="[0-9]{10}" placeholder="10-digit number" required>

      <label for="course">Course</label>
      <input type="text" id="course" name="course" value="{{ form.get('course', '') }}" required>

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" required minlength="5">{{ form.get('address', '') }}</textarea>

      <button type="submit">Register Student</button>
    </form>
  </div>

  <script>
    function validateForm() {
      const phone = document.getElementById('phone').value;
      if (!/^[0-9]{10}$/.test(phone)) {
        alert('Phone number must be exactly 10 digits.');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
